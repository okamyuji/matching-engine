# .golangci.yml
# golangci-lint v2 設定。生成コード（sqlcgen）は対象外にする。

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - nilerr
    - nilnil
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
    misspell:
      locale: US
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        - G404 # ランダム性はランキング摂動用で暗号用途ではない
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    generated: lax
    paths:
      - internal/modules/dating/infrastructure/repository/sqlcgen
      - internal/modules/ma/infrastructure/repository/sqlcgen
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - unparam
          - errcheck
          - gocyclo

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/modules/dating/infrastructure/repository/sqlcgen
      - internal/modules/ma/infrastructure/repository/sqlcgen

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
