# .golangci.yml
# golangci-lint設定ファイル

version: "2"

run:
  timeout: 5m
  # go: "1.25"  # ローカル環境のGoバージョンを自動検出
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell

  disable:
    - depguard

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment

    misspell:
      locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
