# .github/workflows/ci.yml
# GitHub Actions CI設定
#
# トリガー: push, pull_request
# 必須パス: go fmt/go vet/staticcheck/golangci-lint/go test
# カバレッジ: 70%以上（ci ジョブの test-command 内でゲート）
#
# vet / build / test は okamyuji/reusable-workflows の go-ci.yml@v1 に共通化。
# lint / build(成果物) / docker は固有要件のため残置。

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  GO_VERSION: '1.25'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          UNFMT=$(gofmt -l .)
          if [ -n "$UNFMT" ]; then
            echo "Files not formatted:"
            echo "$UNFMT"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7

  # go vet / go build / テスト。Go バージョンは go.mod から解決する。
  # リポジトリ層のテストは testcontainers が MySQL を自前起動するため
  # サービスコンテナは不要。カバレッジ 70% ゲートは従来どおり維持する。
  ci:
    needs: lint
    uses: okamyuji/reusable-workflows/.github/workflows/go-ci.yml@v1
    with:
      test-command: |
        go test -shuffle=on -count=1 -race -coverprofile=coverage.out ./...
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Coverage: ${COVERAGE}%"
        if [ -z "$COVERAGE" ]; then
          echo "No coverage data"
          exit 0
        fi
        if (( $(echo "$COVERAGE < 70" | bc -l) )); then
          echo "Coverage ${COVERAGE}% is below 70%"
          exit 1
        fi

  # gitleaks による秘密情報スキャン（fetch-depth: 0 で履歴全体、GITHUB_TOKEN 内蔵）。
  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s" \
            -o matching-engine \
            ./cmd/api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: matching-engine
          path: matching-engine

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: matching-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
