# compose.yaml（docker-compose.yamlではない）
# 起動: docker compose up -d
# 停止: docker compose down
# ログ: docker compose logs -f app

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - PORT=8080
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=matching_engine
      - DB_USER=matching
      - DB_PASSWORD=matching
      - DB_SSLMODE=disable
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - matching-network

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: matching_engine
      POSTGRES_USER: matching
      POSTGRES_PASSWORD: matching
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      # 初回起動時にスキーマを適用する（docker-entrypoint-initdb.d は空DBのときだけ実行される）
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matching -d matching_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - matching-network

networks:
  matching-network:
    driver: bridge

volumes:
  db-data:
